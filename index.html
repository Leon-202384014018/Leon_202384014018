<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do · Today</title>
<meta name="description" content="A simple to-do list page: add tasks and set priority.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F3E36'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23F4F1EA'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F4F1EA;
    --card:#FFFFFF;
    --ink:#2F3E36;
    --muted:#8B8A80;
    --line:#E6E2D8;
    --high:#E8A79F;
    --medium:#E3C87E;
    --low:#9FC9AE;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding:48px 20px;
  }
  .wrap{max-width:600px;margin:0 auto;}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .brand{margin:0;font-family:var(--serif);letter-spacing:.2em;font-size:13px;text-transform:uppercase;color:var(--muted);}
  .date{margin:0;font-size:13px;color:var(--muted);}
  h1{margin:6px 0 4px;font-family:var(--serif);font-weight:400;font-size:38px;}
  .sub{margin:0 0 22px;color:var(--muted);font-size:14px;}

  .add{display:flex;gap:8px;margin-bottom:26px;}
  .add input{
    flex:1;min-width:0;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;font:inherit;color:var(--ink);
  }
  .add input:focus{outline:2px solid var(--low);border-color:transparent;}
  .add select{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:0 10px;font:inherit;color:var(--ink);
  }
  .add button{
    background:var(--ink);color:var(--paper);border:0;border-radius:10px;
    padding:0 18px;font:inherit;cursor:pointer;
  }
  .add button:hover{opacity:.85;}

  .list{display:flex;flex-direction:column;gap:12px;}
  .group-label{
    margin:22px 0 4px;font-size:11px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);
  }

  .task{
    background:var(--card);border-radius:12px;
    padding:13px 16px;
    display:flex;align-items:center;gap:14px;
    border-left:4px solid var(--line);
    box-shadow:0 1px 2px rgba(47,62,54,.05);
  }
  .task.high{border-left-color:var(--high);}
  .task.medium{border-left-color:var(--medium);}
  .task.low{border-left-color:var(--low);}

  .check{
    width:20px;height:20px;border-radius:50%;flex:none;
    border:1.5px solid var(--ink);
    display:grid;place-items:center;
  }
  .task.done .check{background:var(--ink);border-color:var(--ink);}
  .check svg{width:10px;height:10px;}

  .task-body{min-width:0;flex:1;}
  .task-name{margin:0;font-size:15px;}
  .task.done .task-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;}
  .task-meta{margin:2px 0 0;font-size:12px;color:var(--muted);}

  .foot{margin-top:28px;text-align:center;font-size:12.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="brand">To&nbsp;Do</p>
    <p class="date" id="today">Wednesday, Nov 18</p>
  </div>

  <h1>Today</h1>
  <p class="sub">Add a task and choose its priority.</p>

  <form class="add" id="add-form">
    <input id="task-input" type="text" placeholder="Add a new task…" autocomplete="off">
    <select id="task-priority" aria-label="Priority">
      <option value="high">High</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <div class="list" id="list"></div>

  <p class="foot">To-Do · Senior Capstone Project</p>
</div>

<script>
  // 示例任务；用户新增的任务存 localStorage，刷新不丢
  var DEFAULT_TASKS = [
    { group:"Morning · 上午",   name:"Finish the capstone project README", time:"09:00", priority:"high",   done:false },
    { group:"Afternoon · 下午", name:"Review HTML and CSS class notes",    time:"15:00", priority:"low",    done:false },
    { group:"Afternoon · 下午", name:"Write the class 10 scope note",      time:"18:00", priority:"high",   done:false },
    { group:"Afternoon · 下午", name:"Upload the static page to GitHub",   time:"20:00", priority:"medium", done:false },
    { group:"Done · 已完成",    name:"Answer the four project questions",  time:"10:00", priority:"low",    done:true  }
  ];
  var STORAGE_KEY = "todo-leon-202384014018";

  var tasks;
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    tasks = Array.isArray(saved) && saved.length ? saved : DEFAULT_TASKS.slice();
  } catch (e) { tasks = DEFAULT_TASKS.slice(); }

  var listEl = document.getElementById("list");
  var formEl = document.getElementById("add-form");
  var inputEl = document.getElementById("task-input");
  var selectEl = document.getElementById("task-priority");
  var PRIORITY_LABEL = { high:"High", medium:"Medium", low:"Low" };

  function save(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch(e){}
  }

  function checkSvg(){
    return '<svg viewBox="0 0 12 12" fill="none" stroke="#F4F1EA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.2 2.2 4.5-4.6"></path></svg>';
  }

  function render(){
    listEl.innerHTML = "";
    var lastGroup = null;

    tasks.forEach(function(t){
      if (t.group !== lastGroup) {
        var label = document.createElement("p");
        label.className = "group-label";
        label.textContent = t.group;
        listEl.appendChild(label);
        lastGroup = t.group;
      }

      var card = document.createElement("div");
      card.className = "task " + t.priority + (t.done ? " done" : "");

      var check = document.createElement("span");
      check.className = "check";
      if (t.done) check.innerHTML = checkSvg();

      var body = document.createElement("div");
      body.className = "task-body";
      body.innerHTML = '<p class="task-name"></p><p class="task-meta"></p>';
      body.querySelector(".task-name").textContent = t.name;
      body.querySelector(".task-meta").textContent =
        (t.time ? t.time + " · " : "") + PRIORITY_LABEL[t.priority] + " priority";

      card.appendChild(check);
      card.appendChild(body);
      listEl.appendChild(card);
    });
  }

  formEl.addEventListener("submit", function(e){
    e.preventDefault();
    var name = inputEl.value.trim();
    if (!name) return;
    tasks.unshift({
      group:"Today · 今天",
      name:name,
      time:"",
      priority:selectEl.value,
      done:false
    });
    inputEl.value = "";
    save(); render();
  });

  var now = new Date();
  var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("today").textContent =
    days[now.getDay()] + ", " + months[now.getMonth()] + " " + now.getDate();

  render();
</script>
</body>
</html>
